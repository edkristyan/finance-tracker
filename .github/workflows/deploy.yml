name: Deploy to GitHub Pages

# Runs on every push to main. No manual "push dist/" step needed after this —
# GitHub builds the app fresh from source in a clean environment each time,
# which is also the safer pattern (no built artifacts committed to the repo).
on:
  push:
    branches: [main]
  workflow_dispatch: # allows manually re-running a deploy from the Actions tab

# Least-privilege token scope: this workflow only ever needs to read the repo
# and write to the Pages deployment, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment in flight at a time; a new push cancels a stale one
# that's still running rather than letting them race.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
